<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Person - YellowUmbrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>

<main class="w-[92%] max-w-[1400px] mx-auto flex-1 py-10">
    <p id="status" class="text-center text-brand-gray py-10">Loading…</p>

    <div id="person-content" class="hidden">
        <section class="flex flex-col sm:flex-row gap-6 md:gap-10 items-start">
            <img id="p-photo" src="" alt=""
                 class="w-[160px] sm:w-[220px] md:w-[260px] aspect-[2/3] object-cover rounded-2xl bg-brand-second border border-white/10 flex-none">
            <div class="flex-1 min-w-0">
                <p id="p-role" class="uppercase text-brand-gold font-bold text-xs tracking-widest mb-2"></p>
                <h1 id="p-name" class="text-4xl md:text-6xl font-outfit font-bold leading-tight"></h1>
                <p id="p-birth" class="text-brand-gray mt-2"></p>
                <p id="p-bio" class="text-brand-gray leading-relaxed mt-5 max-w-3xl line-clamp-6 cursor-pointer whitespace-pre-line"
                   title="Click to read more"></p>
            </div>
        </section>

        <p id="syncing" class="hidden mt-10 text-sm text-brand-gray flex items-center gap-3">
            <span class="loading-spinner !w-5 !h-5 !border-2"></span>
            Fetching more of their work from TMDB…
        </p>

        <section id="acting-block" class="hidden mt-12">
            <h2 class="section-title mb-5">Known for</h2>
            <div class="poster-grid" id="p-credits"></div>
        </section>

        <section id="directing-block" class="hidden mt-12">
            <h2 class="section-title mb-5">Directed / created</h2>
            <div class="poster-grid" id="p-directed"></div>
        </section>

        <section class="mt-14 max-w-3xl">
            <h2 class="section-title">Community discussion</h2>
            <div class="bg-black/30 border border-white/10 rounded-2xl p-6 mt-5 auth-only auth-hidden">
                <textarea class="w-full bg-black/20 border border-white/10 text-white py-3 px-4 rounded-lg text-base focus:outline-none focus:border-brand-gold mb-3"
                          id="comment-text" placeholder="Discuss their body of work…" rows="3"></textarea>
                <button class="btn-gold w-full py-3" id="post-comment-btn">Post comment</button>
            </div>
            <div class="mt-6 flex flex-col gap-4" id="comments-feed"></div>
        </section>
    </div>
</main>

<script src="/statics/app.js?v=5"></script>
<script>
    const personId = parseInt(new URLSearchParams(location.search).get('id'));
    const PHOTO_FALLBACK = 'https://placehold.co/260x390/1f2833/c5c6c7?text=No+Photo';

    function renderCredits(person) {
        const acting = person.filmography || [];
        const directed = person.directed || [];
        document.getElementById('acting-block').classList.toggle('hidden', !acting.length);
        document.getElementById('directing-block').classList.toggle('hidden', !directed.length);
        document.getElementById('p-credits').innerHTML = acting.map(c => mediaCard({
            ...c, meta: c.role ? `as ${c.role}` : (c.releasedate || '').slice(0, 4),
        })).join('');
        document.getElementById('p-directed').innerHTML = directed.map(c => mediaCard(c)).join('');
    }

    function renderPerson(person) {
        document.title = `${person.name} - YellowUmbrella`;
        document.getElementById('p-name').textContent = person.name;
        document.getElementById('p-role').textContent = person.role || '';
        document.getElementById('p-photo').src = imageUrl(person.photo, 'w500') || PHOTO_FALLBACK;
        document.getElementById('p-birth').textContent = person.birthdate ? `Born ${person.birthdate}` : '';
        document.getElementById('p-bio').textContent = person.bio || '';
        renderCredits(person);
        document.getElementById('syncing').classList.toggle('hidden', !person.syncing);
    }

    async function fetchPerson() {
        const person = await (await fetch(`/people/${personId}`)).json();
        if (person.error) throw new Error(person.error);
        return person;
    }

    // The first visit to someone's page pulls their best-known work from TMDB
    // in the background. Check back a few times until it's done.
    async function waitForSync(attempt = 0) {
        await new Promise(r => setTimeout(r, 2500));
        try {
            const person = await fetchPerson();
            renderPerson(person);
            if (person.syncing && attempt < 10) waitForSync(attempt + 1);
        } catch (err) {
            document.getElementById('syncing').classList.add('hidden');
        }
    }

    async function loadComments() {
        const feed = document.getElementById('comments-feed');
        try {
            const comments = await (await fetch(`/comments/person/${personId}`)).json();
            feed.innerHTML = comments.length
                ? comments.map(c => `
                    <div class="bg-black/40 border border-white/10 rounded-2xl p-4">
                        <div class="flex justify-between mb-2">
                            <strong class="text-brand-gold text-sm">${escapeHtml(c.username)}</strong>
                            <span class="text-[#777] text-xs">${c.at ? c.at.split(' ')[0] : ''}</span>
                        </div>
                        <p class="text-brand-gray">${escapeHtml(c.text)}</p>
                    </div>`).join('')
                : '<p class="text-brand-gray">No comments yet. Start the discussion!</p>';
        } catch (err) {
            feed.innerHTML = '<p class="text-red-400">Couldn\'t load comments.</p>';
        }
    }

    document.getElementById('p-bio').addEventListener('click', e => e.currentTarget.classList.toggle('line-clamp-6'));

    document.getElementById('post-comment-btn').addEventListener('click', async () => {
        const text = document.getElementById('comment-text').value;
        const user = getUser();
        if (!user) return alert('Must be logged in.');
        if (!text.trim()) return alert('Comment cannot be empty.');
        try {
            await apiFetch('/comments/person', {
                method: 'POST',
                body: JSON.stringify({ personid: personId, userid: user.userid, commenttext: text }),
            });
            document.getElementById('comment-text').value = '';
            await loadComments();
        } catch (err) {
            alert(err.message);
        }
    });

    (async () => {
        const status = document.getElementById('status');
        if (!personId) {
            status.textContent = 'No person selected.';
            return;
        }
        try {
            const person = await fetchPerson();
            status.remove();
            document.getElementById('person-content').classList.remove('hidden');
            renderPerson(person);
            loadComments();
            if (person.syncing) waitForSync();
        } catch (err) {
            status.textContent = `Couldn't load this person: ${err.message}`;
            status.classList.add('text-red-400');
        }
    })();
</script>
</body>
</html>
