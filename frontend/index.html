<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>YellowUmbrella - At the right place, at the right time.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link rel="preconnect" href="https://image.tmdb.org"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>

<!-- Hero: this week's trending titles -->
<header class="relative w-full h-[58vh] min-h-[380px] max-h-[620px] overflow-hidden bg-brand-dark">
    <div id="hero-slides" class="absolute inset-0"></div>
    <div id="hero-dots" class="absolute bottom-5 inset-x-0 flex justify-center gap-2 z-20"></div>
</header>

<!-- Search -->
<section class="w-[92%] max-w-[1400px] mx-auto text-center pt-10 pb-4">
    <h1 class="text-2xl md:text-3xl font-outfit font-bold">At the right place, at the right time.</h1>
    <p class="text-brand-gray mt-2 mb-6">Search movies, series, anime, games and the people who make them.</p>
    <div class="max-w-2xl mx-auto">
        <div class="relative">
            <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-brand-gray pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="home-search" type="search" autocomplete="off" placeholder="Try “Dune”, “Frieren” or “Elden Ring”"
                   class="w-full bg-white/[0.06] border border-white/10 rounded-full pl-14 pr-5 py-4 text-base text-white placeholder-brand-gray/60 outline-none focus:border-brand-gold/60 transition-colors">
        </div>
    </div>
</section>

<main class="w-[92%] max-w-[1400px] mx-auto flex-1 py-8 space-y-14">

    <!-- Trending -->
    <section>
        <div class="flex flex-wrap items-end justify-between gap-3 border-b border-white/10 mb-6">
            <h2 class="section-title pb-3">Trending this week</h2>
            <div class="flex overflow-x-auto -mb-px" id="trending-tabs">
                <button class="trending-tab active" data-type="all">All</button>
                <button class="trending-tab" data-type="movie">Movies</button>
                <button class="trending-tab" data-type="series">Series</button>
                <button class="trending-tab" data-type="anime">Anime</button>
                <button class="trending-tab" data-type="game">Games</button>
            </div>
        </div>
        <div class="poster-grid" id="trending-grid"></div>
    </section>

    <!-- Top rated movies -->
    <section>
        <div class="flex items-end justify-between mb-5">
            <h2 class="section-title">Top rated movies</h2>
            <a href="/top_rated.html" class="text-brand-gold hover:text-white text-sm font-semibold transition-colors">See all →</a>
        </div>
        <div class="poster-row" id="top-rated-row"></div>
    </section>

    <!-- Awards -->
    <section>
        <div class="flex items-end justify-between mb-5">
            <h2 class="section-title">Award ceremonies</h2>
            <a href="/events.html" class="text-brand-gold hover:text-white text-sm font-semibold transition-colors">All awards →</a>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="award-list"></div>
    </section>
</main>

<footer class="border-t border-white/10 py-6 mt-10">
    <div class="w-[92%] max-w-[1400px] mx-auto flex flex-wrap justify-between gap-2 text-sm text-brand-gray">
        <span>YellowUmbrella · CSE 216 Database Sessional · Team Cells Interlinked</span>
        <span>Data from <a href="https://www.themoviedb.org" class="hover:text-white">TMDB</a>, <a href="https://rawg.io" class="hover:text-white">RAWG</a> and <a href="https://www.wikidata.org" class="hover:text-white">Wikidata</a></span>
    </div>
</footer>

<script src="/statics/app.js?v=5"></script>
<script>
    attachSuggest(document.getElementById('home-search'));

    // ── Hero slider ──
    function renderHero(items) {
        const slides = document.getElementById('hero-slides');
        const dots = document.getElementById('hero-dots');
        if (!items.length) return;

        slides.innerHTML = items.map((item, i) => `
            <a href="${item.url}" class="hero-slide absolute inset-0 block transition-opacity duration-700 ${i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'}">
                <img src="${item.backdrop}" alt="" class="absolute inset-0 w-full h-full object-cover"
                     ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'}>
                <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/50 to-transparent"></div>
                <div class="absolute inset-0 bg-gradient-to-r from-brand-dark/90 via-brand-dark/30 to-transparent"></div>
                <div class="relative z-10 h-full w-[92%] max-w-[1400px] mx-auto flex flex-col justify-end pb-14 md:pb-16">
                    <span class="self-start px-2.5 py-1 bg-brand-gold text-brand-dark font-bold rounded text-xs uppercase tracking-wide mb-3">Trending ${item.type}</span>
                    <h2 class="text-3xl sm:text-5xl md:text-6xl font-outfit font-bold max-w-3xl leading-tight">${escapeHtml(item.title)}</h2>
                    <p class="mt-3 flex items-center gap-3 text-brand-gray">
                        ${item.rating ? `<span class="text-brand-gold font-bold">★ ${item.rating}</span><span>·</span>` : ''}
                        <span>${item.year || ''}</span>
                    </p>
                    ${item.overview ? `<div class="hidden md:block mt-3 max-w-2xl"><p class="text-brand-gray/90 line-clamp-2">${escapeHtml(item.overview)}</p></div>` : ''}
                </div>
            </a>`).join('');
        dots.innerHTML = items.map((_, i) =>
            `<button aria-label="Slide ${i + 1}" class="w-2.5 h-2.5 rounded-full transition-colors ${i === 0 ? 'bg-brand-gold' : 'bg-white/30'}"></button>`).join('');

        const all = slides.children;
        let current = 0;
        let timer;
        const show = (i) => {
            all[current].classList.replace('opacity-100', 'opacity-0');
            all[current].classList.replace('z-10', 'z-0');
            dots.children[current].classList.replace('bg-brand-gold', 'bg-white/30');
            current = i;
            all[current].classList.replace('opacity-0', 'opacity-100');
            all[current].classList.replace('z-0', 'z-10');
            dots.children[current].classList.replace('bg-white/30', 'bg-brand-gold');
        };
        const start = () => { clearInterval(timer); timer = setInterval(() => show((current + 1) % all.length), 6000); };
        [...dots.children].forEach((dot, i) => dot.addEventListener('click', () => { show(i); start(); }));
        slides.addEventListener('mouseenter', () => clearInterval(timer));
        slides.addEventListener('mouseleave', start);
        start();
    }

    // ── Trending grid ──
    const trendingCache = {};
    const grid = document.getElementById('trending-grid');

    async function loadTrending(type) {
        if (!trendingCache[type]) {
            grid.innerHTML = skeletonCards(12);
            const res = await fetch(`/discover/trending?type=${type}&limit=24`);
            trendingCache[type] = (await res.json()).results || [];
        }
        return trendingCache[type];
    }

    async function showTrending(type) {
        try {
            const items = await loadTrending(type);
            grid.innerHTML = items.length
                ? items.slice(0, 18).map(item => mediaCard(item)).join('')
                : '<p class="col-span-full text-brand-gray">Nothing trending right now.</p>';
        } catch (err) {
            grid.innerHTML = '<p class="col-span-full text-red-400">Couldn\'t load trending titles.</p>';
        }
    }

    document.querySelectorAll('.trending-tab').forEach(tab => tab.addEventListener('click', () => {
        document.querySelectorAll('.trending-tab').forEach(t => t.classList.toggle('active', t === tab));
        showTrending(tab.dataset.type);
    }));

    loadTrending('all').then(items => {
        // the slider gets the best-known of this week's titles, not just
        // whatever TMDB listed first
        const heroItems = items.filter(i => i.backdrop && i.type !== 'game')
            .sort((a, b) => b.popularity - a.popularity)
            .slice(0, 6);
        renderHero(heroItems);
        showTrending('all');
    }).catch(() => showTrending('all'));

    // ── Top rated row ──
    (async () => {
        const row = document.getElementById('top-rated-row');
        row.innerHTML = skeletonCards(8);
        try {
            const items = await (await fetch('/stats/top-rated/movie?limit=15')).json();
            row.innerHTML = items.map((item, i) => mediaCard({ ...item, type: 'movie' }, { rank: i + 1 })).join('');
        } catch (err) {
            row.innerHTML = '<p class="text-red-400">Couldn\'t load top rated movies.</p>';
        }
    })();

    // ── Award ceremonies ──
    (async () => {
        const list = document.getElementById('award-list');
        try {
            const awards = await (await fetch('/awards/')).json();
            list.innerHTML = awards.slice(0, 3).map(a => `
                <a href="/award.html?id=${a.id}" class="group block rounded-2xl overflow-hidden border border-white/10 hover:border-brand-gold/50 bg-[#111] transition-colors">
                    <div class="aspect-[16/8] overflow-hidden">
                        <img src="${a.imageurl}" alt="" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-bold group-hover:text-brand-gold transition-colors">${escapeHtml(a.name)}</h3>
                        <p class="text-sm text-brand-gray mt-1">Nominees and winners by year</p>
                    </div>
                </a>`).join('');
        } catch (err) {
            list.innerHTML = '<p class="text-red-400">Couldn\'t load award ceremonies.</p>';
        }
    })();
</script>
</body>
</html>
