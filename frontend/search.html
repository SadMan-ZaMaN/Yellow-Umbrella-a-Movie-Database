<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Search - YellowUmbrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>

<main class="w-[92%] max-w-[1400px] mx-auto flex-1 py-10">
    <div class="max-w-2xl">
        <div class="relative">
            <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-brand-gray pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="page-search" type="search" autocomplete="off" placeholder="Search movies, shows, anime, games, people…"
                   class="w-full bg-white/[0.06] border border-white/10 rounded-full pl-14 pr-5 py-3.5 text-base text-white placeholder-brand-gray/60 outline-none focus:border-brand-gold/60 transition-colors">
        </div>
    </div>

    <h1 class="mt-8 text-2xl md:text-3xl font-outfit font-bold">
        Results for <span id="query-label" class="text-brand-gold"></span>
    </h1>
    <div class="flex gap-2 overflow-x-auto mt-5 mb-8 pb-1" id="filters"></div>

    <div class="poster-grid" id="results"></div>
    <p id="empty" class="hidden text-brand-gray py-16 text-center"></p>
</main>

<script src="/statics/app.js?v=5"></script>
<script>
    const query = (new URLSearchParams(location.search).get('q') || '').trim();
    const input = document.getElementById('page-search');
    const resultsEl = document.getElementById('results');
    const emptyEl = document.getElementById('empty');
    const filtersEl = document.getElementById('filters');

    input.value = query;
    attachSuggest(input);
    document.getElementById('query-label').textContent = query ? `“${query}”` : '…';
    document.title = query ? `${query} - Search - YellowUmbrella` : 'Search - YellowUmbrella';

    const LABELS = { all: 'All', movie: 'Movies', series: 'Series', anime: 'Anime', game: 'Games', person: 'People' };
    let results = [];
    let filter = 'all';

    function render() {
        const shown = filter === 'all' ? results : results.filter(r => r.type === filter);
        resultsEl.innerHTML = shown.map(r => mediaCard(r)).join('');
        emptyEl.classList.toggle('hidden', shown.length > 0);
        emptyEl.textContent = `No ${filter === 'all' ? 'results' : LABELS[filter].toLowerCase()} for “${query}”.`;
    }

    function renderFilters() {
        const counts = results.reduce((acc, r) => ({ ...acc, [r.type]: (acc[r.type] || 0) + 1 }), {});
        filtersEl.innerHTML = Object.keys(LABELS)
            .filter(key => key === 'all' || counts[key])
            .map(key => `<button class="chip ${key === filter ? 'is-active' : ''}" data-filter="${key}">
                ${LABELS[key]} <span class="opacity-60">${key === 'all' ? results.length : counts[key]}</span></button>`)
            .join('');
        filtersEl.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
            filter = btn.dataset.filter;
            renderFilters();
            render();
        }));
    }

    (async () => {
        if (query.length < 2) {
            emptyEl.textContent = 'Type at least two letters to search.';
            emptyEl.classList.remove('hidden');
            return;
        }
        resultsEl.innerHTML = skeletonCards(12);
        try {
            const res = await fetch(`/search?q=${encodeURIComponent(query)}&limit=48`);
            results = (await res.json()).results || [];
            renderFilters();
            render();
        } catch (err) {
            resultsEl.innerHTML = '';
            emptyEl.textContent = 'Search failed - check your connection and try again.';
            emptyEl.classList.remove('hidden');
        }
    })();
</script>
</body>
</html>
