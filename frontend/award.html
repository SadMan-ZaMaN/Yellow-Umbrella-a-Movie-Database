<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Awards - YellowUmbrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>

<header class="relative h-[200px] md:h-[280px] overflow-hidden">
    <img id="event-image" src="" alt="" class="absolute inset-0 w-full h-full object-cover opacity-40">
    <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/60 to-transparent"></div>
    <div class="relative h-full w-[92%] max-w-[1400px] mx-auto flex flex-col justify-end pb-8">
        <a href="/events.html" class="text-sm text-brand-gray hover:text-white mb-2">← All ceremonies</a>
        <h1 id="event-title" class="text-3xl md:text-5xl font-extrabold font-outfit">Loading…</h1>
    </div>
</header>

<main class="w-[92%] max-w-[1400px] mx-auto flex-1 flex flex-col md:flex-row gap-6 md:gap-10 py-8">
    <!-- Years: a scrolling strip on phones, a sidebar from tablet up -->
    <aside class="md:w-[180px] shrink-0">
        <h2 class="hidden md:block text-sm font-semibold uppercase tracking-wider text-brand-gray mb-3">Year</h2>
        <div id="year-menu" class="flex md:flex-col gap-2 overflow-x-auto md:overflow-y-auto md:max-h-[70vh] custom-scrollbar pb-2 md:pr-2 md:sticky md:top-24"></div>
    </aside>

    <section class="flex-1 min-w-0">
        <div id="cat-nav" class="flex gap-2 overflow-x-auto pb-2 mb-6"></div>
        <h2 id="viewing" class="text-2xl md:text-3xl font-bold font-outfit mb-6"></h2>
        <div id="nominees" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
        <p id="status" class="text-brand-gray py-10">Loading nominees…</p>
    </section>
</main>

<script src="/statics/app.js?v=5"></script>
<script>
    const eventId = new URLSearchParams(location.search).get('id');
    let years = {};
    let year = null;
    let category = null;

    const PHOTO_FALLBACK = 'https://placehold.co/185x278/1f2833/c5c6c7?text=%3F';

    function renderYears() {
        document.getElementById('year-menu').innerHTML = Object.keys(years)
            .sort((a, b) => b - a)
            .map(y => `<button class="chip md:text-left md:rounded-lg ${y === year ? 'is-active' : ''}" data-year="${y}">${y}</button>`)
            .join('');
        document.querySelectorAll('[data-year]').forEach(btn => btn.addEventListener('click', () => {
            year = btn.dataset.year;
            renderYears();
            renderCategories();
        }));
    }

    function renderCategories() {
        // categories arrive in the server's order (Best Picture first)
        const cats = Object.keys(years[year]);
        if (!cats.includes(category)) category = cats[0];
        document.getElementById('cat-nav').innerHTML = cats.map(c =>
            `<button class="chip ${c === category ? 'is-active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
        document.querySelectorAll('[data-cat]').forEach(btn => btn.addEventListener('click', () => {
            category = btn.dataset.cat;
            renderCategories();
        }));
        renderNominees();
    }

    function renderNominees() {
        document.getElementById('viewing').innerHTML =
            `${year} <span class="text-brand-gold">${escapeHtml(category)}</span>`;
        document.getElementById('nominees').innerHTML = years[year][category].map(n => `
            <a href="${n.url}" class="group flex gap-4 rounded-2xl border p-3 transition-colors ${n.is_winner
                ? 'border-brand-gold/60 bg-gradient-to-r from-brand-gold/10 to-transparent'
                : 'border-white/10 bg-white/[0.03] hover:bg-white/[0.06]'}">
                <img src="${imageUrl(n.photo, 'w185') || PHOTO_FALLBACK}" alt="" loading="lazy"
                     onerror="this.onerror=null;this.src='${PHOTO_FALLBACK}'"
                     class="w-[72px] h-[108px] md:w-[84px] md:h-[126px] rounded-lg object-cover bg-brand-second flex-none">
                <div class="min-w-0 flex flex-col justify-center">
                    ${n.is_winner
                        ? '<span class="self-start mb-2 px-2 py-0.5 rounded bg-brand-gold text-brand-dark text-xs font-bold uppercase">Winner</span>'
                        : '<span class="self-start mb-2 px-2 py-0.5 rounded border border-white/15 text-brand-gray text-xs uppercase">Nominee</span>'}
                    <h3 class="text-lg md:text-xl font-bold leading-tight group-hover:text-brand-gold transition-colors">${escapeHtml(n.name)}</h3>
                    ${n.subtitle ? `<p class="text-sm text-brand-gray mt-1 truncate">${/^\d{4}$/.test(n.subtitle) ? '' : 'for '}${escapeHtml(n.subtitle)}</p>` : ''}
                </div>
            </a>`).join('');
    }

    (async () => {
        const status = document.getElementById('status');
        if (!eventId) {
            status.textContent = 'No ceremony selected.';
            return;
        }
        try {
            const [data, events] = await Promise.all([
                fetch(`/awards/comprehensive/${eventId}`).then(r => r.json()),
                fetch('/awards/').then(r => r.json()),
            ]);
            if (data.error) throw new Error(data.error);

            const event = events.find(e => String(e.id) === eventId);
            if (event) document.getElementById('event-image').src = event.imageurl;
            document.getElementById('event-title').textContent = data.event_name;
            document.title = `${data.event_name} - YellowUmbrella`;

            years = data.years;
            const sorted = Object.keys(years).sort((a, b) => b - a);
            if (!sorted.length) {
                status.textContent = 'No nominations recorded for this ceremony yet.';
                return;
            }
            status.remove();
            year = sorted[0];
            renderYears();
            renderCategories();
        } catch (err) {
            status.textContent = `Couldn't load this ceremony: ${err.message}`;
        }
    })();
</script>
</body>
</html>
