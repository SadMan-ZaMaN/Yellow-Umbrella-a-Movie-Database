<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Celebrities - YellowUmbrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>

<header class="border-b border-white/10 bg-black/40 py-12 text-center px-4">
    <h1 class="text-4xl md:text-5xl font-bold font-outfit">Popular <span class="text-brand-gold">Celebrities</span></h1>
    <p class="text-brand-gray mt-3 max-w-2xl mx-auto">Who people are looking up this week.</p>
</header>

<main class="w-[92%] max-w-[1400px] mx-auto flex-1 py-10">
    <div class="poster-grid" id="celeb-grid"></div>
    <p id="status" class="hidden text-center text-red-400 py-10"></p>
</main>

<script src="/statics/app.js?v=5"></script>
<script>
    (async () => {
        const grid = document.getElementById('celeb-grid');
        const status = document.getElementById('status');
        grid.innerHTML = skeletonCards(18);
        try {
            const people = await (await fetch('/people/popular')).json();
            if (people.error) throw new Error(people.error);
            grid.innerHTML = people.map(p => `
                <a href="${p.url}" class="group block">
                    <div class="poster-card">
                        <img src="${imageUrl(p.photo) || POSTER_FALLBACK}" alt="" loading="lazy" decoding="async">
                    </div>
                    <h3 class="mt-2 font-semibold group-hover:text-brand-gold transition-colors">${escapeHtml(p.name)}</h3>
                    <p class="text-sm text-brand-gray line-clamp-2">${escapeHtml(p.known_for || '')}</p>
                </a>`).join('');
        } catch (err) {
            grid.innerHTML = '';
            status.textContent = `Couldn't load celebrities: ${err.message}`;
            status.classList.remove('hidden');
        }
    })();
</script>
</body>
</html>
