<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Awards - YellowUmbrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>

<header class="border-b border-white/10 bg-black/40 py-12 text-center px-4">
    <h1 class="text-4xl md:text-5xl font-bold font-outfit">Award <span class="text-brand-gold">Ceremonies</span></h1>
    <p class="text-brand-gray mt-3 max-w-2xl mx-auto">Nominees and winners from the biggest ceremonies in film and TV.</p>
</header>

<main class="w-[92%] max-w-[1400px] mx-auto flex-1 py-10">
    <div id="awards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <p id="status" class="text-center text-brand-gray py-10">Loading award shows…</p>
</main>

<script src="/statics/app.js?v=5"></script>
<script>
    (async () => {
        const grid = document.getElementById('awards-grid');
        const status = document.getElementById('status');
        try {
            const awards = await (await fetch('/awards/')).json();
            if (!awards.length) {
                status.textContent = 'No award ceremonies in the database yet.';
                return;
            }
            status.remove();
            grid.innerHTML = awards.map(a => `
                <a href="/award.html?id=${a.id}" class="group block rounded-2xl overflow-hidden border border-white/10 hover:border-brand-gold/50 bg-[#111] transition-colors">
                    <div class="aspect-[16/9] overflow-hidden relative">
                        <img src="${a.imageurl}" alt="" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    </div>
                    <div class="p-6">
                        <h2 class="text-xl font-bold font-outfit group-hover:text-brand-gold transition-colors">${escapeHtml(a.name)}</h2>
                        <p class="text-sm text-brand-gray mt-2">
                            ${a.nominations
                                ? `${a.nominations.toLocaleString()} nominations · ${a.first_year}–${a.last_year}`
                                : 'No nominations yet'}
                        </p>
                        <span class="inline-block mt-4 text-sm font-semibold text-brand-gold group-hover:translate-x-1 transition-transform">Explore →</span>
                    </div>
                </a>`).join('');
        } catch (err) {
            status.textContent = 'Couldn\'t load the award ceremonies.';
        }
    })();
</script>
</body>
</html>
