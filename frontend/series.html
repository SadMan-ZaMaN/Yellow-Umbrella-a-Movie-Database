<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yellow Umbrella - Series Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>
<main class="w-[90%] max-w-[1400px] mx-auto flex-1 py-10">
<div class="text-center mt-[30px] text-brand-gray" id="loading-spinner">Loading Series Data...</div>
<div class="text-red-500 text-center mt-[30px] hidden text-[1.2rem]" id="error-box"></div>
<div id="series-content" class="hidden">
<div class="flex flex-col md:flex-row gap-10 items-end mb-10">
<img id="s-poster" src="" onerror="this.onerror=null;this.src='https://placehold.co/300x450/111/fff?text=No+Poster';" class="w-[300px] rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.8)] border border-white/10"/>
<div class="flex-1 w-full">
<div id="s-genres" class="mb-2.5 text-brand-gold font-semibold uppercase text-xs tracking-widest"></div>
<h1 id="s-title" class="text-4xl md:text-6xl leading-[1.1] font-outfit font-bold mb-2.5 text-white"></h1>
<div class="flex flex-wrap gap-x-5 gap-y-2 text-brand-gray mb-[25px] items-center text-base">
<span id="s-year"></span>
<span>•</span>
<span id="s-network" class="text-white"></span>
<span>•</span>
<span id="s-status" class="bg-black/40 border border-white/10 px-2 py-1 rounded text-xs"></span>
<div class="ml-auto flex gap-3">
<button class="bg-transparent border border-brand-red text-brand-red py-2 px-4 rounded-lg font-semibold text-[0.9rem] hover:bg-brand-red hover:text-white hover:shadow-[0_0_15px_rgba(229,9,20,0.4)] transition auth-only auth-hidden" id="btn-watchlist">+ Watchlist</button>
<button class="bg-transparent border border-[#fbbf24] text-[#fbbf24] py-2 px-4 rounded-lg font-semibold text-[0.9rem] hover:bg-[#fbbf24] hover:text-brand-dark hover:shadow-[0_0_15px_rgba(251,191,36,0.4)] transition auth-only auth-hidden" id="btn-favorite">★ Favorite</button>
<button class="bg-transparent border border-green-500 text-green-500 py-2 px-4 rounded-lg font-semibold text-[0.9rem] hover:bg-green-500 hover:text-white hover:shadow-[0_0_15px_rgba(34,197,94,0.4)] transition auth-only auth-hidden" id="btn-event" onclick="document.getElementById('event-modal').classList.remove('hidden')">📅 Watch Event</button>
</div>
</div>
<div class="bg-black/40 border border-white/10 rounded-[20px] p-[30px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)]">
<div class="flex items-center gap-6">
    <div class="flex-1">
        <h3 class="text-brand-gold font-bold text-lg mb-2.5">Seasons Overview</h3>
        <div id="s-seasons" class="text-brand-gray text-2xl font-medium leading-none mb-2"></div>
        <div class="text-sm"><span class="text-brand-gray">Total Episodes:</span> <span id="s-episodes" class="font-semibold text-white"></span></div>
    </div>
    <div class="border-l border-white/10 pl-6 text-center">
        <span class="text-brand-gray text-xs block mb-1 uppercase tracking-wider">Community Rating</span>
        <h3 id="s-rating" class="text-[#fbbf24] text-3xl font-bold"></h3>
    </div>
</div>
</div>
</div>
</div>
<hr class="border-t border-white/10 my-10"/>
<div class="grid grid-cols-1 md:grid-cols-[2fr_1fr] gap-10">
<!-- Left Col: Cast & Trailers -->
<div>
<h2 class="text-3xl font-bold mb-5">Top Cast</h2>
<div id="s-cast" class="flex flex-wrap gap-2.5 mt-5"></div>
<h2 class="text-3xl font-bold mt-[30px] mb-5">Trailers</h2>
<div id="s-trailers" class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
</div>
<!-- Right Col: Reviews -->
<div>
<h2 class="text-3xl font-bold mb-5 relative inline-block after:absolute after:bottom-[-5px] after:left-0 after:w-1/2 after:h-1 after:bg-brand-red after:rounded">Community Reviews</h2>
<div class="bg-black/40 border border-white/10 rounded-[20px] p-[30px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] mt-5 auth-only auth-hidden">
<h4 class="text-brand-gold mb-2.5 font-semibold">Post a Review</h4>
<div class="flex gap-2.5 mb-2.5">
<input class="w-[100px] bg-black/20 border border-white/10 text-white py-3 px-4 rounded-lg font-sans text-base transition focus:outline-none focus:border-brand-gold focus:bg-black/40 focus:ring-2 focus:ring-brand-gold/20" id="review-rating" max="10" min="1" step="0.1" placeholder="1-10" type="number"/>
</div>
<textarea class="w-full bg-black/20 border border-white/10 text-white py-3 px-4 rounded-lg font-sans text-base transition focus:outline-none focus:border-brand-gold focus:bg-black/40 focus:ring-2 focus:ring-brand-gold/20 mb-2.5 resize-none inline-block align-top" id="review-text" placeholder="What are your thoughts?" rows="3"></textarea>
<button class="bg-brand-red text-white py-3 px-6 rounded-lg font-semibold text-base hover:bg-[currentColor] hover:shadow-[0_0_15px_rgba(229,9,20,0.4)] hover:-translate-y-0.5 transition inline-flex items-center justify-center gap-2 w-full" id="post-review-btn">Submit Review</button>
</div>
<div class="mt-[30px] flex flex-col gap-[15px]" id="reviews-feed"></div>
</div>
</div>
</main>

<!-- Watch Event Modal -->
<div id="event-modal" class="hidden fixed inset-0 z-[2000] flex items-center justify-center bg-black/70">
<div class="bg-brand-dark border border-white/10 rounded-2xl p-8 w-full max-w-md shadow-[0_20px_60px_rgba(0,0,0,0.8)]">
<h3 class="text-2xl font-bold text-brand-gold mb-5">📅 Schedule Watch Event</h3>
<input id="evt-title" class="w-full mb-3 bg-black/40 border border-white/10 text-white py-3 px-4 rounded-lg focus:outline-none focus:border-brand-gold transition" placeholder="Event Title"/>
<input id="evt-time" type="datetime-local" class="w-full mb-3 bg-black/40 border border-white/10 text-white py-3 px-4 rounded-lg focus:outline-none focus:border-brand-gold transition"/>
<input id="evt-platform" class="w-full mb-3 bg-black/40 border border-white/10 text-white py-3 px-4 rounded-lg focus:outline-none focus:border-brand-gold transition" placeholder="Platform (e.g. Discord, Teleparty)"/>
<textarea id="evt-desc" rows="2" class="w-full mb-3 bg-black/40 border border-white/10 text-white py-3 px-4 rounded-lg focus:outline-none focus:border-brand-gold transition resize-none" placeholder="Description (optional)"></textarea>
<input id="evt-link" class="w-full mb-4 bg-black/40 border border-white/10 text-white py-3 px-4 rounded-lg focus:outline-none focus:border-brand-gold transition" placeholder="Stream/Invite Link (optional)"/>
<div class="flex gap-3">
<button id="evt-submit" class="flex-1 bg-brand-gold text-brand-dark py-3 rounded-lg font-bold hover:bg-brand-goldhover transition">Create Event</button>
<button class="flex-1 bg-white/5 border border-white/10 text-brand-gray py-3 rounded-lg font-semibold hover:bg-white/10 transition" onclick="document.getElementById('event-modal').classList.add('hidden')">Cancel</button>
</div>
<div id="evt-status" class="mt-3 text-sm text-center hidden"></div>
</div>
</div>

<script src="/statics/app.js?v=5"></script>
<script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const seriesId = params.get('id') ? parseInt(params.get('id')) : 1001; // Example series ID fallback

            try {
                const res = await fetch(`/series/${seriesId}`);
                const series = await res.json();
                
                if (series.error) throw new Error(series.error);

                document.getElementById('loading-spinner').style.display = 'none';
                document.getElementById('series-content').style.display = 'block';

                document.title = `${series.title} - Yellow Umbrella`;
                
                document.getElementById('s-title').textContent = series.title;
                showDetailExtras(series, document.getElementById('s-title'));
                document.getElementById('s-poster').src = (series.posterurl && series.posterurl.startsWith('/')) ? ('https://image.tmdb.org/t/p/w500' + series.posterurl) : (series.posterurl || 'https://placehold.co/300x450');
                document.getElementById('s-year').textContent = series.releasedate ? series.releasedate.split('-')[0] : 'TBA';
                document.getElementById('s-genres').textContent = (series.genres || []).join(' • ');
                document.getElementById('s-network').textContent = series.network || 'Unknown Network';
                document.getElementById('s-status').textContent = series.isended ? 'Ended' : 'Ongoing';
                document.getElementById('s-seasons').textContent = `${series.totalseasons || 0} Seasons`;
                document.getElementById('s-episodes').textContent = series.totalepisodes || '?';
                document.getElementById('s-rating').textContent = series.avgrating ? `★ ${parseFloat(series.avgrating).toFixed(1)}/10` : 'Not Rated';

                
                renderCast(document.getElementById('s-cast'), series.cast);

                // Render Trailers
                const trailerDiv = document.getElementById('s-trailers');
                if (series.trailers && series.trailers.length > 0) {
                    series.trailers.forEach(t => {
                        const a = document.createElement('a');
                        a.className = 'bg-black/40 border border-white/10 rounded-[20px] p-[15px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] text-center no-underline text-white hover:-translate-y-1 transition';
                        a.href = t.url;
                        a.target = '_blank';
                        a.innerHTML = `<span class="text-[2rem] block mb-[10px]">▶</span>${t.title}`;
                        trailerDiv.appendChild(a);
                    });
                } else {
                    trailerDiv.innerHTML = '<span class="text-[#555]">No trailers available.</span>';
                }

                // Handle Reviews Logic
                const loadReviews = async () => {
                    const reviewFeed = document.getElementById('reviews-feed');
                    reviewFeed.innerHTML = 'Loading reviews...';
                    try {
                        const res = await fetch(`/reviews/${seriesId}`);
                        const reviews = await res.json();
                        
                        if (reviews.error || reviews.length === 0) {
                            reviewFeed.innerHTML = '<div class="text-brand-gray italic">No reviews yet.</div>';
                            return;
                        }
                        
                        reviewFeed.innerHTML = reviews.map(rv => `
                            <div class="bg-black/40 border border-white/10 rounded-[20px] p-[20px] shadow-[0_8px_32px_0_rgba(0,0,0,0.37)]">
                                <div class="flex justify-between mb-2.5">
                                    <strong class="text-brand-gold">${escapeHtml(rv.username)}</strong>
                                    <span class="text-[#fbbf24] font-bold">★ ${rv.rating}/10</span>
                                </div>
                                <p class="text-brand-gray mb-2.5 text-[0.95rem]">${escapeHtml(rv.comment)}</p>
                            </div>
                        `).join('');
                    } catch(err) {
                        reviewFeed.innerHTML = 'Error loading reviews.';
                    }
                };
                
                await loadReviews();

                // Add to Watchlist & Favorites Logic
                const wBtn = document.getElementById('btn-watchlist');
                if (wBtn) {
                    wBtn.addEventListener('click', async () => {
                        const user = getUser();
                        if (!user) return alert("Must log in first");
                        wBtn.textContent = 'Adding...';
                        try {
                            await apiFetch(`/watchlist/`, {
                                method: 'POST',
                                body: JSON.stringify({ mediaid: seriesId, userid: user.userid })
                            });
                            wBtn.textContent = 'Saved ✓';
                            wBtn.style.color = '#52c41a';
                            wBtn.style.borderColor = '#52c41a';
                        } catch(err) {
                            alert("Failed to watchlist: " + err.message);
                            wBtn.textContent = '+ Watchlist';
                        }
                    });
                }

                const fBtn = document.getElementById('btn-favorite');
                if (fBtn) {
                    fBtn.addEventListener('click', async () => {
                        const user = getUser();
                        if (!user) return alert("Must log in first");
                        fBtn.textContent = '★...';
                        try {
                            await apiFetch(`/lists/${user.userid}/Favorites/${seriesId}`, { method: 'POST' });
                            fBtn.textContent = '★ Favorited';
                            fBtn.style.color = '#0B0C10';
                            fBtn.style.backgroundColor = '#fbbf24';
                        } catch(err) {
                            alert("Failed to favorite: " + err.message);
                            fBtn.textContent = '★ Favorite';
                        }
                    });
                }

                // Post Review
                const postBtn = document.getElementById('post-review-btn');
                postBtn.addEventListener('click', async () => {
                    const rating = document.getElementById('review-rating').value;
                    const text = document.getElementById('review-text').value;
                    const user = getUser();
                    
                    if (!user) return alert("Must be logged in.");
                    
                    try {
                        await apiFetch(`/reviews/`, {
                            method: 'POST',
                            body: JSON.stringify({ mediaid: seriesId, userid: user.userid, rating: parseFloat(rating), commenttext: text })
                        });
                        document.getElementById('review-rating').value = '';
                        document.getElementById('review-text').value = '';
                        await loadReviews();
                    } catch (err) {
                        alert(err.message);
                    }
                });

    
                // Watch Event Creation
                document.getElementById('evt-submit').addEventListener('click', async () => {
                    const user = getUser();
                    if (!user) return alert("Must be logged in.");
                    const title = document.getElementById('evt-title').value;
                    const time = document.getElementById('evt-time').value;
                    const platform = document.getElementById('evt-platform').value;
                    const desc = document.getElementById('evt-desc').value;
                    const link = document.getElementById('evt-link').value;
                    if (!title || !time) return alert("Please fill in event title and time.");
                    const statusEl = document.getElementById('evt-status');
                    statusEl.classList.remove('hidden');
                    statusEl.textContent = 'Creating event...';
                    statusEl.className = 'mt-3 text-sm text-center text-brand-gray';
                    try {
                        await apiFetch('/events/', {
                            method: 'POST',
                            body: JSON.stringify({
                                host_userid: user.userid,
                                mediaid: seriesId,
                                title: title,
                                description: desc,
                                platform: platform,
                                event_time: time,
                                stream_link: link,
                                ispublic: true
                            })
                        });
                        statusEl.textContent = '✅ Event created successfully!';
                        statusEl.className = 'mt-3 text-sm text-center text-green-400';
                        setTimeout(() => { document.getElementById('event-modal').classList.add('hidden'); }, 1500);
                    } catch(err) {
                        statusEl.textContent = '❌ ' + err.message;
                        statusEl.className = 'mt-3 text-sm text-center text-red-400';
                    }
                });

            } catch (err) {
                document.getElementById('loading-spinner').style.display = 'none';
                const el = document.getElementById('error-box');
                el.style.display = 'block';
                el.textContent = err.message || "Failed to load Series database entry.";
            }
        });
    </script>
</body>
</html>
