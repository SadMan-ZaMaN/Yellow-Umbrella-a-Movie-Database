<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Top Rated - YellowUmbrella</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="/statics/site.css?v=5" rel="stylesheet"/>
</head>
<body class="bg-brand-dark text-white min-h-screen flex flex-col font-sans">
<nav id="site-nav"></nav>

<header class="border-b border-white/10 bg-black/40 py-12 text-center px-4">
    <h1 class="text-4xl md:text-5xl font-bold font-outfit">Top Rated <span class="text-brand-gold">Media</span></h1>
    <p class="text-brand-gray mt-3 max-w-2xl mx-auto">
        Ranked by weighted rating, the same formula IMDb uses, so a title needs plenty of votes
        and not just a few perfect scores.
    </p>
</header>

<main class="w-[92%] max-w-[1400px] mx-auto flex-1 py-10 space-y-12" id="rows"></main>

<script src="/statics/app.js?v=5"></script>
<script>
    const SECTIONS = [['movie', 'Movies'], ['series', 'Series'], ['anime', 'Anime'], ['game', 'Games']];
    const main = document.getElementById('rows');

    main.innerHTML = SECTIONS.map(([type, label]) => `
        <section>
            <h2 class="section-title mb-5">Top rated <span class="text-brand-gold">${label.toLowerCase()}</span></h2>
            <div class="poster-row" id="row-${type}">${skeletonCards(8)}</div>
        </section>`).join('');

    SECTIONS.forEach(async ([type]) => {
        const row = document.getElementById(`row-${type}`);
        try {
            const items = await (await fetch(`/stats/top-rated/${type}?limit=20`)).json();
            row.innerHTML = items.length
                ? items.map((item, i) => mediaCard({ ...item, type }, { rank: i + 1 })).join('')
                : '<p class="text-brand-gray">Nothing here yet.</p>';
        } catch (err) {
            row.innerHTML = '<p class="text-red-400">Couldn\'t load this list.</p>';
        }
    });
</script>
</body>
</html>
